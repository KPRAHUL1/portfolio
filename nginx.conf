server {
  listen       80;
  server_name  _;
  root         /usr/share/nginx/html;
  index        index.html;

  # Vite emits content-hashed filenames under /assets/, so those URLs can
  # never go stale — cache them hard.
  location /assets/ {
    expires    1y;
    add_header Cache-Control "public, immutable";
    try_files  $uri =404;
  }

  # SPA fallback: same job as the /* rule in netlify.toml. Without it, a hard
  # refresh on /about or /blog/:id would 404 instead of reaching React Router.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
