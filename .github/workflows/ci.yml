name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  DOCKER_IMAGE_NAME: kprahul/personal-site
# Cancel an in-progress run when new commits land on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` is `tsc -b && vite build`, so this typechecks too.
      - name: Build
        run: npm run build

  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    # Independent of the lint job so both run in parallel. This builds the site
    # again inside the image, which is the point: it proves the Dockerfile works
    # from a clean checkout.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: kprahul/personal-site
          # `latest` only on main; every build also gets an immutable sha tag
          # so you can always pull the exact commit that produced an image.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      # Built and tested before any login, so a broken image never reaches the
      # registry. Tagged locally here; the real tags are applied after the test.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: personal-site:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name portfolio -p 8080:80 personal-site:ci

          # nginx needs a moment before it accepts connections.
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8080/ >/dev/null && break
            sleep 1
          done

          # The app shell actually rendered, not just a default nginx page.
          curl -fsS http://localhost:8080/ | grep -q 'id="root"'

          # Deep link must return 200 via the SPA fallback, not 404.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/about)
          if [ "$code" != "200" ]; then
            echo "SPA fallback broken: /about returned $code"
            docker logs portfolio
            exit 1
          fi

          docker rm -f portfolio

      # Skipped on pull requests: PRs from forks cannot read secrets, and an
      # unreviewed PR should not be able to publish to your Docker Hub account.
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Re-tags and pushes the exact image that just passed the smoke test,
      # rather than rebuilding it.
      - name: Push to Docker Hub
        if: github.event_name == 'push'
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while read -r tag; do
            [ -z "$tag" ] && continue
            echo "Pushing $tag"
            docker tag personal-site:ci "$tag"
            docker push "$tag"
          done

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    # Only deploy an image that was built, smoke-tested and actually pushed.
    needs: docker
    # Never deploy from a pull request: secrets are unavailable there, and an
    # unreviewed PR should not be able to reach the server.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # /var/www/personal-site is created and chowned to ec2-user by
      # deploy/ec2-bootstrap.sh, which must be run once on a fresh instance.
      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: docker-compose.yml
          target: /var/www/personal-site

      - name: server ssh
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # Falls back to 22 when SERVER_PORT isn't set. Passing the bare
          # secret would send an empty string and override the action's own
          # default, failing the connection.
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # Replaces the old script_stop input, which newer versions of
            # ssh-action no longer accept: abort on the first failing command
            # so a broken deploy fails the job instead of reporting green.
            set -eo pipefail

            cd /var/www/personal-site

            # Pin the deploy to this commit's image rather than :latest, so a
            # re-run of an older workflow redeploys that commit, not whatever
            # latest currently points at.
            echo "TAG=sha-${{ github.sha }}" > .env

            docker compose pull
            docker compose up -d

            # Confirm nginx is actually serving before calling the deploy good.
            for i in $(seq 1 15); do
              curl -fsS http://localhost/ >/dev/null 2>&1 && break
              sleep 1
            done
            curl -fsS http://localhost/ | grep -q 'id="root"'

            # Old image versions pile up fast on a small EC2 root volume.
            docker image prune -f
