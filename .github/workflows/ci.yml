name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  DOCKER_IMAGE_NAME: kprahul/personal-site
# Cancel an in-progress run when new commits land on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` is `tsc -b && vite build`, so this typechecks too.
      - name: Build
        run: npm run build

  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    # Independent of the lint job so both run in parallel. This builds the site
    # again inside the image, which is the point: it proves the Dockerfile works
    # from a clean checkout.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: kprahul/personal-site
          # `latest` only on main; every build also gets an immutable sha tag
          # so you can always pull the exact commit that produced an image.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      # Built and tested before any login, so a broken image never reaches the
      # registry. Tagged locally here; the real tags are applied after the test.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: personal-site:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name portfolio -p 8080:80 personal-site:ci

          # nginx needs a moment before it accepts connections.
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8080/ >/dev/null && break
            sleep 1
          done

          # The app shell actually rendered, not just a default nginx page.
          curl -fsS http://localhost:8080/ | grep -q 'id="root"'

          # Deep link must return 200 via the SPA fallback, not 404.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/about)
          if [ "$code" != "200" ]; then
            echo "SPA fallback broken: /about returned $code"
            docker logs portfolio
            exit 1
          fi

          docker rm -f portfolio

      # Skipped on pull requests: PRs from forks cannot read secrets, and an
      # unreviewed PR should not be able to publish to your Docker Hub account.
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Re-tags and pushes the exact image that just passed the smoke test,
      # rather than rebuilding it.
      - name: Push to Docker Hub
        if: github.event_name == 'push'
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while read -r tag; do
            [ -z "$tag" ] && continue
            echo "Pushing $tag"
            docker tag personal-site:ci "$tag"
            docker push "$tag"
          done

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    # Only deploy an image that was built, smoke-tested and actually pushed.
    needs: docker
    # Never deploy from a pull request: secrets are unavailable there.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      IMAGE: kprahul/personal-site
      CONTAINER: portfolio

    steps:
      - name: server ssh
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          # Makes the job-level env vars above visible inside the remote shell.
          envs: IMAGE,CONTAINER
          script: |
            # Abort on the first failing command. Replaces the script_stop
            # input, which newer versions of ssh-action no longer accept.
            set -eo pipefail

            # Pin to this commit's image rather than :latest, so you can always
            # tell what is running and re-running an old job redeploys that build.
            TAG=sha-${{ github.sha }}

            # Pull before stopping anything, so the old container keeps serving
            # if the pull fails. Also keeps cached layers instead of `rmi` first.
            docker pull "$IMAGE:$TAG"

            # `|| true` because there is nothing to stop on the first deploy.
            docker stop "$CONTAINER" || true
            docker rm "$CONTAINER" || true

            docker run -d               --name "$CONTAINER"               --restart unless-stopped               -p 80:80               "$IMAGE:$TAG"

            # Confirm nginx is really serving before calling the deploy good.
            for i in $(seq 1 15); do
              curl -fsS http://localhost/ >/dev/null 2>&1 && break
              sleep 1
            done
            curl -fsS http://localhost/ | grep -q 'id="root"'

            # Old image versions fill a small EC2 root volume fast.
            docker image prune -f
