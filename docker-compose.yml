services:
  web:
    # TAG is written to .env by the deploy workflow and pins the image to the
    # exact commit being deployed. Defaults to latest for manual runs.
    image: kprahul/personal-site:${TAG:-latest}
    container_name: portfolio
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
